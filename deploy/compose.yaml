services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:?Set GITHUB_REPOSITORY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET}
      RELAY_GITHUB_TOKEN: ${RELAY_GITHUB_TOKEN:?Set RELAY_GITHUB_TOKEN}
      HARNESS_TRIGGER_URL: ${HARNESS_TRIGGER_URL:?Set HARNESS_TRIGGER_URL}
      HARNESS_TRIGGER_SECRET: ${HARNESS_TRIGGER_SECRET:?Set HARNESS_TRIGGER_SECRET}
      AGENT_LABEL: ${AGENT_LABEL:-agent}
      DATABASE_PATH: /data/relay.sqlite3
    volumes:
      - relay_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Port 8000 is reachable by Caddy only, not published on the Droplet.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  relay_data:
  caddy_data:
  caddy_config:
